  - composition-patterns
  - playwright
  - code-review-skill
  - web-quality-skills
  - web-design-guidelines
tools:
  - fs
  - pwsh
  - jobs
  - present
mcp:
  - playwright
critic:
  enabled: true
  mode: read-only
  rubric:
    - 正确性
    - 性能
    - 安全
    - 可维护性
deliverables:
  - app/src/
  - app/tests/e2e/
  - app/perf-report.md
  - app/review/code-review.md
handoff:
  to:
    - backend-dev
  artifact: 接口契约需求 + 错误码 + 分页/缓存策略
