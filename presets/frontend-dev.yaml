id: frontend-dev
name: 前端开发
description: 把设计落成可运行、可维护、可测试的代码：设计系统落地、框架最佳实践、性能预算、E2E 与代码审查。
# 薄预设：不写 persona，行为全部由挂载的技能提供（技能按需加载，不常驻上下文）。
# 本预设只声明「挂哪些技能、能碰哪些工具、按什么标准评审、交付什么」。
skills:
  - frontend-dev
external_skills:
  - vue
  - nuxt
  - pinia
  - vitest
  - vercel-react-best-practices
  - composition-patterns
  - code-review-skill
  - web-quality-skills
  - web-design-guidelines
  # playwright skills 由 playwright-cli 分发（manual），不进默认挂载；需要时按 docs/skill-catalog.md 安装。
tools:
  - fs
  - pwsh
  - jobs
  - todo
  - present
  - codegraph
critic:
  enabled: true
  mode: read-only
deliverables:
  - app/src/
  - app/tests/e2e/
  - app/perf-report.md
  - app/review/code-review.md
handoff:
  to:
    - backend-dev
  artifact: 接口契约需求 + 错误码 + 分页/缓存策略