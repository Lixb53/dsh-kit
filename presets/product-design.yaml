id: product-design
name: 产品设计
description: 上游定义与对齐：把模糊需求转成规则化 PRD、泳道流程图与带规则标注的原型，并在变更时输出影响分析。
# 薄预设：不写 persona，行为全部由挂载的技能提供（技能按需加载，不常驻上下文）。
# 本预设只声明「挂哪些技能、能碰哪些工具、按什么标准评审、交付什么」。
skills:
  - product-design
external_skills:
  - one-line-prototype
  - pm-skills
  # spec-kit 是 manual（CLI + 流程），不进默认挂载；需要 L 级规格链路时按 docs/skill-catalog.md 自行安装。
tools:
  - fs
  - pwsh
  - web
  - todo
  - present
critic:
  enabled: true
  mode: read-only
deliverables:
  - requirements/<feature>/prd.md
  - requirements/<feature>/flows/
  - requirements/<feature>/prototype/
  - requirements/<feature>/confirmation.md
  - requirements/<feature>/impact.md
  - requirements/<feature>/review/critique.md
handoff:
  to:
    - ui-design
    - frontend-dev
    - backend-dev
  artifact: 规则清单 + 流程图 + 原型 + 验收要点