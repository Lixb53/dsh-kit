id: ui-design
name: UI 设计
description: 视觉与体验定义：先锁方向卡，再产出设计令牌、组件规范与响应式方案，并对前端实现做四维 UX 审查。
# 薄预设：不写 persona，行为全部由挂载的技能提供（技能按需加载，不常驻上下文）。
# 本预设只声明「挂哪些技能、能碰哪些工具、按什么标准评审、交付什么」。
skills:
  - ui-design
external_skills:
  - ui-ux-pro-max
  - ux-ui-agent-skills
  - accessibility-agents
  # frontend-design 许可不明确（见 docs/skill-catalog.md），按选型原则不进默认预设；需要时手动启用。
tools:
  - fs
  - pwsh
  - present
mcp:
  - playwright
critic:
  enabled: true
  mode: read-only
deliverables:
  - design/<feature>/direction-card.md
  - design/<feature>/tokens.json
  - design/<feature>/components/
  - design/<feature>/prototype/
  - design/<feature>/review/5b-round-1.md
handoff:
  to:
    - frontend-dev
  artifact: 方向卡 + 令牌 + 组件规范 + 原型
