# 外部技能本地挂载配置示例
# 用法：复制为 external-skills.local.yaml（已被 .gitignore 忽略），按本机路径填写。
# 语义：key = 预设 id，value = 该预设要额外挂载的本地外部技能安装目录列表。
# 说明：一条目录会被整体暴露给该预设；目录内每个含 SKILL.md 的直接子目录算一个技能。
#       详见 docs/external-skills.md。

ui-design:
  - 'D:\tools\dsh-external-skills'

product-design:
  - 'D:\tools\dsh-external-skills'

frontend-dev:
  - 'D:\tools\dsh-external-skills'

backend-dev:
  - 'D:\tools\dsh-external-skills'
