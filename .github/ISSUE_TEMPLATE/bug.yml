name: 问题 / 修正
description: 报告技能步骤、预设引用或文档中的错误
title: "[fix] "
labels: ["bug"]
body:
  - type: input
    id: target
    attributes:
      label: 涉及对象
      description: 哪个技能或预设？例如 skills/frontend-dev/SKILL.md
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 按文档/技能执行时，本应发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？附上命令输出、截图或文件:行号
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现方式
      description: 最小复现步骤；能贴命令就贴命令
      placeholder: |
        1. node scripts/validate-skills.mjs
        2. 输出 error ...
